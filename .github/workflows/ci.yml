name: CI

on:
  push:
    branches:
      - main
      - design/professional-ui-v1
      - 'feature/**'
  pull_request:
    branches:
      - main
      - design/professional-ui-v1

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run production build
        run: npm run build

