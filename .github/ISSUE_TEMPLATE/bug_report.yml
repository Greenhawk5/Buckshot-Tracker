name: Bug Report
description: Create a report to help us fix an issue in Buckshot Tracker
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        Please ensure no sensitive credentials, bot tokens, or private Telegram data are included.

  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: A clear and concise description of what the bug is.
      placeholder: e.g. Ejecting shell via beer can when Position 1 is unknown behaves unexpectedly
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Select 3L / 3B preset
        2. Tap Start Tracking
        3. Log Burner Phone intel for Position 2
        4. Tap Beer Eject
        5. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment & Client
      description: Telegram client, OS, and browser/webview version.
      placeholder: e.g. Telegram Desktop 5.10 (Windows 11) / Telegram Android 10.14
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Console Logs / Error Output
      description: Any error messages, stack traces, or console output (please redact private tokens).
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Verification
      options:
        - label: I have verified this is not a duplicate of an existing issue.
          required: true
        - label: I have confirmed this bug report contains no sensitive tokens, secrets, or personal data.
          required: true
